[project]
name = "flowent"
version = "0.3.12"
description = "Just say what you need. Flowent gets it done."
readme = "README.md"
authors = [
    { name = "ImFeH2", email = "i@feh2.im" }
]
requires-python = ">=3.11"
license = "Apache-2.0"
keywords = [
    "ai",
    "agent",
    "ai-agent",
    "ai-workspace",
    "agent-runtime",
    "agentic-workflows",
    "automation",
    "workflow",
    "workflow-automation",
    "mcp",
    "llm",
    "fastapi",
    "react",
    "telegram-bot",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "fastapi[standard]>=0.136.1",
    "flowent-native==0.3.12",
    "litellm>=1.84.0",
    "mcp>=1.24.0",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pyinstaller>=6.14.1,<7.0.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]
native-build = [
    "maturin==1.13.3",
    "pyinstaller>=6.14.1,<7.0.0",
    "pytest>=9.0.3,<10.0",
]

[project.scripts]
flowent = "flowent:main"

[project.urls]
Homepage = "https://github.com/ImFeH2/flowent"
Repository = "https://github.com/ImFeH2/flowent"
Issues = "https://github.com/ImFeH2/flowent/issues"

[build-system]
requires = ["uv_build>=0.8.14,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
flowent-native = { path = "../native/flowent-native" }

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
