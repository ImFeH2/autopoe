[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[project]
name = "flowent-native"
description = "Platform runtime resources for Flowent"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [
    { name = "ImFeH2", email = "i@feh2.im" }
]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/ImFeH2/flowent"
Repository = "https://github.com/ImFeH2/flowent"
Issues = "https://github.com/ImFeH2/flowent/issues"

[project.optional-dependencies]
tests = [
    "pytest",
]

[tool.maturin]
bindings = "bin"
exclude = ["python/**/__pycache__/**", "python/**/*.py[cod]"]
include = [{ path = "python/flowent_native/runtime/**/*", format = "wheel" }]
module-name = "flowent_native"
python-source = "python"
python-packages = ["flowent_native"]
strip = true
