commit-msg:
  jobs:
    - name: commit message
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: app
      run: pnpm check:app && pnpm test:app
    - name: flowent
      run: pnpm check:flowent && pnpm test:flowent
    - name: rust
      run: pnpm check:rust && pnpm test:rust
