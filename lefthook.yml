commit-msg:
  jobs:
    - name: commit message
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: app
      run: pnpm check:app && pnpm test:app
    - name: huddol
      run: pnpm check:huddol && pnpm test:huddol
    - name: rust
      run: pnpm check:rust && pnpm test:rust
