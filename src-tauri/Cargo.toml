[package]
name = "flowent"
version = "0.0.1"
description = "Just say what you need. Flowent gets it done."
authors = ["ImFeH2 <i@feh2.im>"]
edition = "2024"

[lib]
name = "flowent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
agent = { path = "../agent" }
tauri = { version = "2", features = [] }
