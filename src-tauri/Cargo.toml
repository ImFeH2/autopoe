[package]
name = "flowent"
version = "0.0.0"
description = "Just say what you need. Flowent gets it done."
authors = ["ImFeH2 <i@feh2.im>"]
edition = "2024"

[lib]
name = "flowent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
