[project]
name = "huddol"
version = "0.0.0"
description = "Run your own organization of agents."
authors = [
    { name = "ImFeH2", email = "i@feh2.im" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "psutil>=7.2.2",
    "pydantic-ai-slim[anthropic,duckduckgo,google,openai]>=2.28.0",
]

[project.scripts]
huddol = "huddol.__main__:main"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pyinstaller>=6.21.0",
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]
