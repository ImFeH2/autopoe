name: Release
run-name: Release ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release"
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      EXPECTED_EVENT: ${{ github.event_name }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Verify release tag
        id: tag
        env:
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          tag_sha="$(git rev-parse HEAD)"
          if [ "$EXPECTED_EVENT" = "push" ] && [ "$tag_sha" != "$WORKFLOW_SHA" ]; then
            echo "Release tag $RELEASE_TAG does not match the workflow commit."
            exit 1
          fi
          echo "sha=$tag_sha" >> "$GITHUB_OUTPUT"

      - name: Wait for package publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.tag.outputs.sha }}
        run: |
          workflows=(npm-publish.yml pypi-publish.yml docker-publish.yml)
          declare -A titles=(
            [npm-publish.yml]="Publish npm package $RELEASE_TAG"
            [pypi-publish.yml]="Publish Python package $RELEASE_TAG"
            [docker-publish.yml]="Docker $RELEASE_TAG"
          )
          declare -A minimum_ids
          if [ "$EXPECTED_EVENT" = "workflow_dispatch" ]; then
            for workflow in "${workflows[@]}"; do
              runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
                -f event="$EXPECTED_EVENT" \
                -f per_page=100)"
              minimum_ids[$workflow]="$(jq --arg title "${titles[$workflow]}" \
                '[.workflow_runs[] | select(.display_title == $title) | .id] | max // 0' \
                <<<"$runs")"
              gh workflow run "$workflow" --ref "$RELEASE_TAG" -f tag="$RELEASE_TAG"
            done
          fi
          for attempt in $(seq 1 240); do
            all_complete=true
            all_success=true
            summary=""

            for workflow in "${workflows[@]}"; do
              if [ "$EXPECTED_EVENT" = "push" ]; then
                runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
                  -f event="$EXPECTED_EVENT" \
                  -f head_sha="$RELEASE_SHA" \
                  -f per_page=100)"
              else
                runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
                  -f event="$EXPECTED_EVENT" \
                  -f per_page=100)"
              fi
              if [ "$EXPECTED_EVENT" = "workflow_dispatch" ]; then
                run="$(jq --arg title "${titles[$workflow]}" --argjson before "${minimum_ids[$workflow]}" \
                  '.workflow_runs | map(select(.display_title == $title and .id > $before)) | sort_by(.id) | last // {}' \
                  <<<"$runs")"
              else
                run="$(jq --arg title "${titles[$workflow]}" \
                  '.workflow_runs | map(select(.display_title == $title)) | sort_by(.id) | last // {}' \
                  <<<"$runs")"
              fi
              status="$(jq -r '.status // "missing"' <<<"$run")"
              conclusion="$(jq -r '.conclusion // "pending"' <<<"$run")"
              run_id="$(jq -r '.id // "none"' <<<"$run")"
              summary="$summary$workflow: run=$run_id status=$status conclusion=$conclusion\n"

              if [ "$status" != "completed" ]; then
                all_complete=false
              elif [ "$conclusion" != "success" ]; then
                all_success=false
              fi
            done

            printf '%b' "$summary"
            if [ "$all_complete" = true ]; then
              if [ "$all_success" = true ]; then
                break
              fi
              echo "At least one publishing workflow failed."
              exit 1
            fi
            if [ "$attempt" -eq 240 ]; then
              echo "Timed out waiting for publishing workflows."
              exit 1
            fi
            sleep 15
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi

          gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes --verify-tag
