name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  wsl-host:
    name: Build WSL host bridge
    needs: quality
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: huddol-host -> target
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build WSL host bridge
        run: cargo build --manifest-path huddol-host/Cargo.toml --release --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v7
        with:
          name: huddol-wsl-host
          path: huddol-host/target/x86_64-unknown-linux-musl/release/huddol-host
          if-no-files-found: error

  build:
    name: Build (${{ matrix.os }})
    needs:
      - quality
      - wsl-host
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-15
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: huddol/uv.lock
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - uses: actions/download-artifact@v8
        if: runner.os == 'Windows'
        with:
          name: huddol-wsl-host
          path: ${{ runner.temp }}/huddol-wsl-host
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        env:
          LEFTHOOK: 0
      - name: Install Python dependencies
        run: uv sync --project huddol --all-groups --frozen
      - name: Build release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUDDOL_WSL_HOST_BINARY: ${{ runner.os == 'Windows' && format('{0}/huddol-wsl-host/huddol-host', runner.temp) || '' }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: Huddol ${{ github.ref_name }}
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Publish release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
