name: Publish npm package
run-name: Publish npm package ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to publish"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  native:
    name: Build native npm packages
    uses: ./.github/workflows/native-build.yml
    with:
      ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      release_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

  publish:
    name: Publish to npm
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      HUSKY: 0
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check package version
        env:
          EXPECTED_VERSION: ${{ needs.native.outputs.version }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$package_version" != "$EXPECTED_VERSION" ]; then
            echo "package.json version $package_version does not match native version $EXPECTED_VERSION."
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v$package_version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version."
            exit 1
          fi

      - name: Download platform packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: .release/native
          merge-multiple: true

      - name: Stage main package
        run: |
          node scripts/package-runtime/stage-main-package.mjs --output .release/main
          mkdir -p .release/npm
          npm pack .release/main --pack-destination .release/npm

      - name: Verify npm package set
        run: |
          platform_count="$(find .release/native/npm -maxdepth 1 -type f -name '*.tgz' | wc -l)"
          main_count="$(find .release/npm -maxdepth 1 -type f -name '*.tgz' | wc -l)"
          test "$platform_count" -eq 6
          test "$main_count" -eq 1

      - name: Upload main npm package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: npm-main
          path: .release/npm/*.tgz
          if-no-files-found: error

      - name: Publish platform packages
        run: |
          while IFS= read -r package; do
            node scripts/release/publish-npm-package.mjs "$package" --tag platform
          done < <(find .release/native/npm -maxdepth 1 -type f -name '*.tgz' | sort)

      - name: Publish main package
        run: node scripts/release/publish-npm-package.mjs .release/npm/*.tgz
