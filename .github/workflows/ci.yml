name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-22.04
    env:
      TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: flowent/uv.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        env:
          LEFTHOOK: 0
      - name: Install Python dependencies
        run: uv sync --project flowent --all-groups --frozen
      - name: Verify repository
        run: pnpm verify
      - name: Build frontend
        run: pnpm build:frontend
      - name: Check release build
        working-directory: app/src-tauri
        run: cargo check --release

  host-tools:
    name: Host tools (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: flowent/uv.lock
      - name: Install Python dependencies
        run: uv sync --project flowent --all-groups --frozen
      - name: Verify host tools and Flowent lifecycle
        run: uv run --project flowent pytest flowent/tests/test_host_tools.py flowent/tests/test_runtime.py flowent/tests/test_process.py -q -W error
