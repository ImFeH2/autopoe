name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wsl_core:
    name: Linux backend component
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - name: Install sandbox
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install Python dependencies
        run: uv sync --project core --all-groups --frozen
      - name: Build Linux backend
        run: node scripts/build-core.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: wsl-core
          path: artifacts/wsl-core.tar
          if-no-files-found: error

  ci:
    name: ${{ matrix.name }}
    needs: wsl_core
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x64
            os: ubuntu-latest
          - name: Windows x64
            os: windows-latest
          - name: macOS Apple Silicon
            os: macos-15
          - name: macOS Intel
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    env:
      TAURI_CONFIG: '{"bundle":{"externalBin":[]}}'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: core/uv.lock
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        env:
          LEFTHOOK: 0
      - name: Install Python dependencies
        run: uv sync --project core --all-groups --frozen
      - name: Check
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Build frontend
        run: pnpm build:frontend
      - uses: actions/download-artifact@v5
        if: runner.os == 'Windows'
        with:
          name: wsl-core
          path: artifacts
      - name: Package the core
        run: pnpm build:core
      - name: Check release build
        working-directory: app/src-tauri
        run: cargo check --release
