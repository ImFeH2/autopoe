name: Native build

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      release_tag:
        required: false
        type: string
        default: ""
    outputs:
      version:
        value: ${{ jobs.prepare.outputs.version }}

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare native build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      HUSKY: 0
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 10.33.2
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.13"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend files
        run: pnpm build:frontend && node scripts/prepare-python-package.mjs

      - name: Check release versions
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version="$(python scripts/release/check_versions.py)"
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "v$version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload frontend files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: flowent-static
          path: backend/src/flowent/static
          if-no-files-found: error
          retention-days: 7

  build:
    name: ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      SOURCE_DATE_EPOCH: 315532800
      PYTHONHASHSEED: 0
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-24.04
            platform: linux
            architecture: x64
            rust_target: x86_64-unknown-linux-gnu
            native_manifest: native/flowent-native/Cargo.toml
            native_binary: native/flowent-native/target/x86_64-unknown-linux-gnu/release/flowent-native
            application: .artifacts/work/application/flowent/flowent
            runtime_args: --cc cc
            manylinux_container: quay.io/pypa/manylinux2014_x86_64@sha256:0d25b049964b2549b83384036abdff06789a8c0b1e9ff003ec80f0d531f79e50
            freeze_container: ghcr.io/pyo3/maturin@sha256:f45fb3795c81b8bfb5fa0e644a7060d2204ceeeb7a525330b065072dec398f82
            pytest: backend/tests/test_sandbox_core.py backend/tests/test_sandbox_linux.py native/flowent-native/python/tests
            macos_target: ""
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            platform: linux
            architecture: arm64
            rust_target: aarch64-unknown-linux-gnu
            native_manifest: native/flowent-native/Cargo.toml
            native_binary: native/flowent-native/target/aarch64-unknown-linux-gnu/release/flowent-native
            application: .artifacts/work/application/flowent/flowent
            runtime_args: --cc cc
            manylinux_container: quay.io/pypa/manylinux2014_aarch64@sha256:ae34a6ceeefe0b535c525b2e96f297311c8f1e01cfd8b9be5f647eece5b5c60b
            freeze_container: ghcr.io/pyo3/maturin@sha256:287bb0b76ca36c6dda8befeb44277c207c81f8fe43c54736cbb7d4934b75ad1d
            pytest: backend/tests/test_sandbox_core.py backend/tests/test_sandbox_linux.py native/flowent-native/python/tests
            macos_target: ""
          - target: darwin-x64
            runner: macos-15-intel
            platform: darwin
            architecture: x64
            rust_target: x86_64-apple-darwin
            native_manifest: native/flowent-native/Cargo.toml
            native_binary: native/flowent-native/target/x86_64-apple-darwin/release/flowent-native
            application: .artifacts/work/application/flowent/flowent
            runtime_args: ""
            pytest: backend/tests/test_sandbox_core.py backend/tests/test_sandbox_macos.py native/flowent-native/python/tests
            macos_target: "11.0"
          - target: darwin-arm64
            runner: macos-15
            platform: darwin
            architecture: arm64
            rust_target: aarch64-apple-darwin
            native_manifest: native/flowent-native/Cargo.toml
            native_binary: native/flowent-native/target/aarch64-apple-darwin/release/flowent-native
            application: .artifacts/work/application/flowent/flowent
            runtime_args: ""
            pytest: backend/tests/test_sandbox_core.py backend/tests/test_sandbox_macos.py native/flowent-native/python/tests
            macos_target: "11.0"
          - target: win32-x64
            runner: windows-2025
            platform: win32
            architecture: x64
            rust_target: x86_64-pc-windows-msvc
            native_manifest: native/flowent-sandbox-windows/Cargo.toml
            native_binary: native/flowent-sandbox-windows/target/x86_64-pc-windows-msvc/release/flowent-native.exe
            application: .artifacts/work/application/flowent/flowent.exe
            runtime_args: ""
            pytest: backend/tests/test_sandbox_core.py backend/tests/test_sandbox_windows.py backend/tests/test_shell.py native/flowent-native/python/tests
            macos_target: ""
          - target: win32-arm64
            runner: windows-11-arm
            platform: win32
            architecture: arm64
            rust_target: aarch64-pc-windows-msvc
            native_manifest: native/flowent-sandbox-windows/Cargo.toml
            native_binary: native/flowent-sandbox-windows/target/aarch64-pc-windows-msvc/release/flowent-native.exe
            application: .artifacts/work/application/flowent/flowent.exe
            runtime_args: ""
            pytest: backend/tests/test_sandbox_core.py backend/tests/test_sandbox_windows.py backend/tests/test_shell.py native/flowent-native/python/tests
            macos_target: ""
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
          architecture: ${{ matrix.architecture }}
          package-manager-cache: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.13.13"
          architecture: ${{ matrix.architecture }}

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.8.14"

      - name: Setup Rust
        run: |
          rustup set profile minimal
          rustup toolchain install 1.93.1
          rustup default 1.93.1

      - name: Install Linux build tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcap-dev
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Download frontend files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: flowent-static
          path: backend/src/flowent/static

      - name: Prepare Python package
        run: node scripts/prepare-python-readme.mjs

      - name: Export locked Python build dependencies
        run: |
          python -c "from pathlib import Path; Path('.artifacts').mkdir(exist_ok=True)"
          uv export --project backend --frozen --no-dev --no-emit-project --no-emit-package flowent-native --output-file .artifacts/runtime-requirements.txt
          uv export --project backend --frozen --only-group native-build --no-emit-project --no-emit-package flowent-native --output-file .artifacts/native-build-requirements.txt

      - name: Install Python build dependencies
        run: |
          uv pip install --system --require-hashes -r .artifacts/runtime-requirements.txt -r .artifacts/native-build-requirements.txt
          uv pip install --system --no-deps ./backend

      - name: Test native implementation
        env:
          PYTHONPATH: native/flowent-native/python
          PYTHONDONTWRITEBYTECODE: 1
        run: |
          cargo test --locked --manifest-path "${{ matrix.native_manifest }}" --target "${{ matrix.rust_target }}"
          python -m pytest ${{ matrix.pytest }}

      - name: Build native helper
        if: matrix.platform == 'win32'
        run: cargo build --locked --release --manifest-path "${{ matrix.native_manifest }}" --target "${{ matrix.rust_target }}"

      - name: Prepare verified runtime files
        run: node scripts/release/prepare-native-runtime.mjs --target "${{ matrix.target }}" --native "${{ matrix.native_binary }}" --output .artifacts/runtime --version "${{ needs.prepare.outputs.version }}" ${{ matrix.runtime_args }}

      - name: Stage frozen application inputs
        if: matrix.platform == 'linux'
        run: node scripts/package-runtime/stage-pyinstaller-input.mjs --target "${{ matrix.target }}" --source .artifacts/runtime --plan .artifacts/runtime/runtime-plan.json --work .artifacts/work

      - name: Build Linux frozen application
        if: matrix.platform == 'linux'
        run: |
          docker run --rm \
            --env PYTHONHASHSEED=0 \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env SOURCE_DATE_EPOCH=315532800 \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
            --workdir "$GITHUB_WORKSPACE" \
            --entrypoint /bin/bash \
            "${{ matrix.freeze_container }}" \
            -euxo pipefail -c '
              uv python install 3.13.13
              uv venv --python 3.13.13 /tmp/flowent-freeze
              uv pip install --python /tmp/flowent-freeze/bin/python --require-hashes \
                -r .artifacts/runtime-requirements.txt \
                -r .artifacts/native-build-requirements.txt
              uv pip install --python /tmp/flowent-freeze/bin/python --no-deps ./backend
              /tmp/flowent-freeze/bin/python scripts/package-runtime/freeze.py \
                --project-root . \
                --input .artifacts/work/runtime/pyinstaller-input.json \
                --output .artifacts/work/application \
                --work .artifacts/work/pyinstaller-build \
                --spec .artifacts/work/pyinstaller-spec
            '

      - name: Build platform npm package
        if: matrix.platform != 'linux'
        run: node scripts/package-runtime/build-platform-package.mjs --target "${{ matrix.target }}" --source .artifacts/runtime --plan .artifacts/runtime/runtime-plan.json --work .artifacts/work --output .artifacts/npm-package --version "${{ needs.prepare.outputs.version }}"

      - name: Stage Linux platform npm package
        if: matrix.platform == 'linux'
        run: node scripts/package-runtime/build-platform-package.mjs --target "${{ matrix.target }}" --source .artifacts/runtime --plan .artifacts/runtime/runtime-plan.json --work .artifacts/work --application .artifacts/work/application/flowent --output .artifacts/npm-package --version "${{ needs.prepare.outputs.version }}"

      - name: Stage Python native wheel files
        run: |
          node scripts/runtime/stage-python-wheel.mjs --target "${{ matrix.target }}" --source .artifacts/runtime --plan .artifacts/runtime/runtime-plan.json --package-root native/flowent-native
          node -e "require('node:fs').mkdirSync('.artifacts/dist/python',{recursive:true})"

      - name: Build manylinux Python native wheel
        if: matrix.platform == 'linux'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b
        with:
          command: build
          args: --locked --release --manifest-path native/flowent-native/Cargo.toml --out .artifacts/dist/python --compatibility pypi
          container: ${{ matrix.manylinux_container }}
          docker-options: -e SOURCE_DATE_EPOCH -e PYTHONHASHSEED
          manylinux: 2_17
          maturin-version: v1.13.3
          rust-toolchain: "1.93.1"
          target: ${{ matrix.rust_target }}

      - name: Build Python native wheel
        if: matrix.platform != 'linux'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
        run: maturin build --locked --release --manifest-path native/flowent-native/Cargo.toml --target "${{ matrix.rust_target }}" --out .artifacts/dist/python --compatibility pypi

      - name: Pack platform npm package
        run: |
          node -e "require('node:fs').mkdirSync('.artifacts/dist/npm',{recursive:true})"
          npm pack .artifacts/npm-package --pack-destination .artifacts/dist/npm

      - name: Verify native artifacts
        run: python scripts/release/verify_native_artifacts.py --target "${{ matrix.target }}" --version "${{ needs.prepare.outputs.version }}" --application "${{ matrix.application }}" --npm-dir .artifacts/dist/npm --wheel-dir .artifacts/dist/python

      - name: Install and verify Python native wheel
        run: |
          python -c "import glob,subprocess,sys; wheels=glob.glob('.artifacts/dist/python/*.whl'); assert len(wheels)==1; subprocess.run([sys.executable,'-m','pip','install','--force-reinstall','--no-deps',wheels[0]],check=True)"
          python -c "import flowent_native; names=flowent_native.available_resources(); assert names; [flowent_native.resource_path(name) for name in names]"

      - name: Probe native command protection
        env:
          FLOWENT_DATA_DIR: ${{ runner.temp }}/flowent-data-${{ matrix.target }}
        run: python scripts/release/probe_command_protection.py --root .artifacts/command-protection-probe

      - name: Check frozen application
        env:
          FLOWENT_DATA_DIR: ${{ runner.temp }}/flowent-data-${{ matrix.target }}
        run: python -c "import subprocess,sys; subprocess.run([sys.argv[1], 'doctor'], check=True)" "${{ matrix.application }}"

      - name: Upload native artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.target }}
          path: .artifacts/dist
          if-no-files-found: error
          retention-days: 7
