[package]
name = "huddol-app"
version = "0.0.0"
description = "Run your own organization of agents."
authors = ["ImFeH2 <i@feh2.im>"]
edition = "2024"

[lib]
name = "huddol_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = { path = "vendor/tauri-plugin-single-instance-2.4.3/crate", version = "=2.4.3" }
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[features]
debug = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
